<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email Signature</title>
<style>
body {
font-family: Manrope, sans-serif;
margin: 0;
padding: 20px;
background-color: #f5f5f5;
}
.signature-container {
max-width: 380px;
background-color: white;
padding:20px;
}
.signature {
display: table;
width: 100%;
}
.left-section {
display: table-cell;
vertical-align: top;
width:45%;
padding-right: 0px;
border-right: 4px solid #4169E1;
}
.logo {
margin-bottom: 0px;
}
.logo img {
width: 100px;
height: auto;
display: block;
margin-left: 0px;
}
.company-name {
font-size: 13px;
font-weight: bold;
color: #000;
margin: 0px 0px 30px 0px;
text-align: left;
padding-right: 20px;
}
.social-icons {
display: flex;
gap: 10px;
margin-top: 10px;
margin-left: 0px;
}
.social-icons a {
display: block;
}
.social-icons img {
width: 20px;
height: 20px;
}
.right-section {
display: table-cell;
vertical-align: top;
width: 55%;
padding-left: 20px;
}
.name {
font-size: 12px;
font-weight: bold;
color: #000;
margin: 0 0 5px 0;
}
.title {
font-size: 10px;
color: #000;
margin: 0 0 15px 0;
}
.contact-info {
margin-top: 5px;
}
.contact-row {
display: flex;
align-items: flex-start;
margin-bottom: 5px;
}
.contact-icon {
width: 20px;
margin-right: 10px;
flex-shrink: 0;
}
.contact-icon svg {
width: 20px;
height: 20px;
}
.contact-text {
font-size: 8px;
color: #000;
line-height: 1.2;
}
.contact-text a {
color: #000;
text-decoration: none;
}
</style>
</head>
